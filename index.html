<html lang="en">

<script type="importmap">

</script>
<style>
:root{--bg:#050b13;--panel:#091523;--panel2:#0d1c2d;--line:#1d354d;--text:#eef7ff;--muted:#8fa6bb;--cyan:#61e4ff;--violet:#aa7cff;--green:#66e0aa;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:radial-gradient(circle at 50% -10%,#17334e 0,#07111d 40%,#03070c 100%);color:var(--text)}
button,input{font:inherit}.app{height:100%;display:grid;grid-template-rows:68px 1fr}
header{display:flex;align-items:center;gap:14px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(4,10,18,.88);backdrop-filter:blur(18px);z-index:20}
.logo{display:flex;align-items:center;gap:10px;min-width:220px}.mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--cyan),var(--violet));display:grid;place-items:center;color:#04101b;font-weight:900;box-shadow:0 0 28px rgba(97,228,255,.2)}.logo strong{display:block;font-size:14px;letter-spacing:.05em}.logo small{display:block;color:var(--muted);margin-top:2px}
.search{position:relative;flex:1;max-width:700px}.search input{width:100%;height:44px;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:#081522;color:var(--text);padding:0 16px;outline:none}.search input:focus{border-color:#4fa9c4;box-shadow:0 0 0 3px rgba(97,228,255,.07)}
.search-results{display:none;position:absolute;top:50px;left:0;right:0;max-height:430px;overflow:auto;background:#081522;border:1px solid #24435f;border-radius:15px;box-shadow:0 24px 70px rgba(0,0,0,.45);z-index:40}.result{display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;padding:10px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}.result:hover{background:#10243a}.result small{display:block;color:var(--muted);margin-top:2px}.tag{font-size:9px;border:1px solid #294966;border-radius:7px;padding:4px 6px;color:#a8bccd}
.header-actions{margin-left:auto;display:flex;gap:7px}.btn{border:1px solid rgba(255,255,255,.1);background:#0a1827;color:var(--text);border-radius:11px;padding:10px 12px;cursor:pointer}.btn.primary{border:0;background:linear-gradient(135deg,#14758d,#6c4daf);font-weight:800}.btn:hover{filter:brightness(1.15)}
main{min-height:0;display:grid;grid-template-columns:290px minmax(0,1fr) 370px}.panel{background:rgba(7,16,28,.88);backdrop-filter:blur(16px);overflow:auto;min-height:0}.left{border-right:1px solid rgba(255,255,255,.08);padding:13px}.right{border-left:1px solid rgba(255,255,255,.08)}
.section-label{font-size:10px;text-transform:uppercase;letter-spacing:.15em;color:#7690a7;font-weight:800;margin:14px 7px 8px}.sys{width:100%;display:grid;grid-template-columns:30px 1fr auto;gap:9px;align-items:center;border:1px solid transparent;background:transparent;color:var(--text);border-radius:12px;padding:9px;text-align:left;cursor:pointer;margin-bottom:3px}.sys:hover,.sys.active{background:#102239;border-color:#1c3a56}.ico{width:29px;height:29px;border-radius:9px;background:#11263a;display:grid;place-items:center}.sys small{display:block;color:var(--muted);margin-top:1px}.count{font-size:9px;padding:3px 6px;border-radius:99px;border:1px solid var(--line);color:#94a9bc}
.tree{font-size:12px}.tree-row{display:flex;align-items:center;gap:6px;min-height:32px;border-radius:9px;padding-right:5px;cursor:pointer}.tree-row:hover,.tree-row.active{background:#10243a}.tree-arrow{width:16px;color:#6d879d}.tree-dot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}.tree-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tree-level{font-size:9px;color:#71879a;margin-left:auto}
.stage{position:relative;overflow:hidden;min-width:0;min-height:0}#viewport{position:absolute;inset:0}canvas{display:block}
.topbar{position:absolute;left:14px;right:14px;top:14px;display:flex;align-items:center;gap:7px;pointer-events:none}.glass{pointer-events:auto;background:rgba(5,14,24,.72);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:9px 11px;font-size:11px;color:#d8e6f2}.crumbs{max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mode-badge{margin-left:auto;color:#9fd9e6}.bottom-controls{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:5px;background:rgba(5,14,24,.78);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.1);padding:6px;border-radius:16px}.bottom-controls button{border:0;background:transparent;color:#dbe8f4;border-radius:10px;padding:8px 10px;cursor:pointer;font-size:11px}.bottom-controls button:hover,.bottom-controls button.active{background:#17304a}.hint{position:absolute;right:15px;bottom:18px;color:#71879a;font-size:10px}.depth-card{position:absolute;left:16px;bottom:16px;width:210px;background:rgba(5,14,24,.74);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:10px}.depth-card strong{font-size:11px}.depth-card p{font-size:10px;color:#8ca2b5;margin:4px 0 8px;line-height:1.4}.depth-track{height:5px;background:#1b2c3d;border-radius:99px;overflow:hidden}.depth-fill{height:100%;width:20%;background:linear-gradient(90deg,var(--cyan),var(--violet));transition:.25s}
.detail-head{padding:18px;border-bottom:1px solid rgba(255,255,255,.08);position:sticky;top:0;background:rgba(7,16,28,.96);z-index:3}.eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--cyan);font-weight:800}.detail-head h1{font-size:25px;line-height:1.08;margin:6px 0}.latin{color:var(--muted);font-size:12px;font-style:italic}.detail{padding:17px}.detail p{font-size:13px;line-height:1.6;color:#c2d2df;margin:0}.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}.fact{padding:10px;border:1px solid var(--line);background:#091725;border-radius:12px}.fact strong{display:block;font-size:15px}.fact span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}.detail h3{font-size:10px;color:#a6bbcc;text-transform:uppercase;letter-spacing:.13em;margin:18px 0 8px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{border:1px solid #24445f;background:#10263b;color:#d8e6f2;border-radius:99px;padding:6px 8px;font-size:10px;cursor:pointer}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px}.actions button{border:1px solid var(--line);background:#102338;color:#e5f0f9;border-radius:10px;padding:9px;cursor:pointer}.children{display:grid;gap:6px}.child{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:9px;border-radius:11px;border:1px solid var(--line);background:#0a1928;cursor:pointer}.child:hover{border-color:#3c6888}.child small{color:var(--muted)}
.quiz{border:1px solid #2b5574;background:#0c1e31;border-radius:15px;padding:13px}.quiz h2{font-size:18px;margin:7px 0}.notice{font-size:10px;color:#6e8497;line-height:1.45;margin-top:14px}
@media(max-width:1080px){main{grid-template-columns:230px 1fr}.right{position:absolute;right:0;top:68px;bottom:0;width:360px;z-index:35;transform:translateX(102%);transition:.24s}.right.open{transform:none}.header-actions .btn:first-child{display:none}}
@media(max-width:760px){main{grid-template-columns:1fr}.left{display:none}.logo{min-width:auto}.logo small{display:none}.header-actions{display:none}.right{width:min(94vw,370px)}.depth-card{display:none}.hint{display:none}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="logo"><div class="mark">H3</div><div><strong>HUMAN ATLAS 3D</strong><small>From whole body to deep anatomy</small></div></div>
  <div class="search"><input id="search" placeholder="Search skull, frontal lobe, C1, aorta, kidney..."/><div id="results" class="search-results"></div></div>
  <div class="header-actions"><button id="reset" class="btn">Reset</button><button id="quiz" class="btn primary">Quiz me</button></div>
</header>
<main>
<aside class="panel left">
  <div class="section-label">Systems</div><div id="systems"></div>
  <div class="section-label">Anatomy hierarchy</div><div id="tree" class="tree"></div>
</aside>
<section class="stage">
  <div id="viewport"></div>
  <div class="topbar"><div id="crumbs" class="glass crumbs">Human Body</div><div id="mode" class="glass mode-badge">Whole-body view</div></div>
  <div class="depth-card"><strong>Anatomy depth</strong><p id="depthText">Whole body → systems → organs → structures</p><div class="depth-track"><div id="depthFill" class="depth-fill"></div></div></div>
  <div class="bottom-controls">
    <button data-view="front">Front</button><button data-view="back">Back</button><button data-view="left">Left</button><button data-view="right">Right</button>
    <button id="explode">Explode</button><button id="isolate">Isolate</button><button id="restore">Restore</button>
  </div>
  <div class="hint">Drag rotate • wheel zoom • click anatomy • double-click drills deeper</div>
</section>
<aside id="right" class="panel right">
  <div class="detail-head"><div id="eyebrow" class="eyebrow">Interactive anatomy</div><h1 id="title">Human Body</h1><div id="latin" class="latin">Corpus humanum</div></div>
  <div id="detail" class="detail"></div>
</aside>
</main>
</div>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {systems,anatomy,byId,childrenOf,descendantsOf} from "./anatomy-data.js";

const viewport=document.getElementById("viewport");
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x07111f,.035);
const camera=new THREE.PerspectiveCamera(38,1,.1,100);camera.position.set(5.8,2.7,10);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;viewport.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,1,0);controls.minDistance=2;controls.maxDistance=20;
scene.add(new THREE.HemisphereLight(0x9fdcff,0x142032,2.2));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(4,7,7);scene.add(key);const rim=new THREE.DirectionalLight(0x8a6cff,2);rim.position.set(-5,3,-6);scene.add(rim);
const grid=new THREE.GridHelper(16,32,0x23415a,0x10263a);grid.position.y=-3.85;scene.add(grid);

const root=new THREE.Group();scene.add(root);
const meshes=[],meshById={};let selected=byId.body,systemFilter="all",isolated=false,exploded=false,currentDepth=0;

function material(color,opacity=.9){return new THREE.MeshPhysicalMaterial({color,roughness:.52,metalness:0,clearcoat:.06,transparent:opacity<1,opacity,side:THREE.DoubleSide})}
function register(m,id){m.userData.id=id;(meshById[id]??=[]).push(m);meshes.push(m);root.add(m);return m}
function sph(id,pos,scale,color,opacity=.92){const m=register(new THREE.Mesh(new THREE.SphereGeometry(1,32,24),material(color,opacity)),id);m.position.set(...pos);m.scale.set(...scale);return m}
function cap(id,pos,r,len,color,rot=[0,0,0],opacity=.92){const m=register(new THREE.Mesh(new THREE.CapsuleGeometry(r,len,10,20),material(color,opacity)),id);m.position.set(...pos);m.rotation.set(...rot);return m}
function box(id,pos,scale,color,rot=[0,0,0]){const m=register(new THREE.Mesh(new THREE.BoxGeometry(...scale),material(color)),id);m.position.set(...pos);m.rotation.set(...rot);return m}
function tor(id,pos,major,tube,color,rot=[0,0,0],arc=Math.PI*2){const m=register(new THREE.Mesh(new THREE.TorusGeometry(major,tube,10,40,arc),material(color)),id);m.position.set(...pos);m.rotation.set(...rot);return m}
function tube(id,points,color,r=.024){const curve=new THREE.CatmullRomCurve3(points.map(p=>new THREE.Vector3(...p)));return register(new THREE.Mesh(new THREE.TubeGeometry(curve,64,r,8,false),material(color)),id)}
function colorFor(id){const a=byId[id];return a?.system?systems[a.system].color:"#7bbbd0"}

const skin=new THREE.MeshPhysicalMaterial({color:0x72c8dc,transparent:true,opacity:.055,roughness:.25,transmission:.08,depthWrite:false,side:THREE.DoubleSide});
function shell(geo,pos,scale=[1,1,1],rot=[0,0,0]){const m=new THREE.Mesh(geo,skin);m.position.set(...pos);m.scale.set(...scale);m.rotation.set(...rot);root.add(m)}
shell(new THREE.SphereGeometry(1,32,24),[0,3.33,0],[.72,.92,.66]);shell(new THREE.CapsuleGeometry(.73,2.48,12,24),[0,1.35,0],[1,1,.78]);
shell(new THREE.CapsuleGeometry(.27,2.65,10,18),[-1.03,1.08,0],[1,1,1],[0,0,-.08]);shell(new THREE.CapsuleGeometry(.27,2.65,10,18),[1.03,1.08,0],[1,1,1],[0,0,.08]);
shell(new THREE.CapsuleGeometry(.34,2.9,10,18),[-.48,-2,0],[1,1,1],[0,0,.05]);shell(new THREE.CapsuleGeometry(.34,2.9,10,18),[.48,-2,0],[1,1,1],[0,0,-.05]);

// Detailed skull
sph("parietal-bones",[0,3.55,-.02],[.59,.55,.57],0xe9dfcd,.86);
sph("frontal-bone",[0,3.6,.39],[.53,.43,.18],0xf2e5cf,.94);
sph("occipital-bone",[0,3.44,-.48],[.48,.45,.15],0xdacdb8,.94);
for(const s of [-1,1]) sph("temporal-bones",[s*.47,3.31,-.03],[.16,.34,.33],0xe4d7c3,.94);
box("sphenoid",[0,3.18,.03],[.48,.18,.25],0xd9c8ae,[.1,0,0]);
const jaw=cap("mandible",[0,2.91,.08],.24,.46,0xe6d9c4,[Math.PI/2,0,0]);jaw.scale.x=1.45;

// Brain regions nested just inside skull
sph("frontal-lobe",[0,3.54,.25],[.47,.46,.34],0xf4a0b9,.9);
sph("parietal-lobe",[0,3.60,-.05],[.48,.43,.34],0xe888ad,.9);
for(const s of [-1,1]) sph("temporal-lobe",[s*.31,3.31,.04],[.28,.27,.33],0xd9799f,.9);
sph("occipital-lobe",[0,3.45,-.34],[.39,.34,.19],0xc76791,.92);
sph("cerebellum",[0,3.09,-.30],[.36,.27,.25],0xf1a184,.94);
cap("brainstem",[0,2.98,-.08],.09,.42,0xf0c47b);
sph("pituitary",[0,3.20,.17],[.07,.06,.07],0xbf84d8,.98);

// spine
for(let i=0;i<7;i++){const y=2.65-i*.15;box(i===0?"c1-atlas":i===1?"c2-axis":"cervical-spine",[Math.sin(i*.3)*.025,y,-.14],[.29,.105,.26],0xe7dfcf,[0,(i%2?-.04:.04),0])}
for(let i=0;i<12;i++){const y=1.58-i*.15;box("thoracic-spine",[Math.sin(i*.23)*.03,y,-.15],[.34,.11,.28],0xe7dfcf,[0,(i%2?-.04:.04),0])}
for(let i=0;i<5;i++){const y=-.25-i*.18;box("lumbar-spine",[Math.sin(i*.35)*.025,y,-.13],[.42,.135,.34],0xe7dfcf)}
sph("sacrum",[0,-1.12,-.08],[.34,.48,.22],0xe1d6c4,.94);
cap("spinal-cord",[0,.93,-.08],.052,3.58,0xffd86b);

// ribs + sternum
for(const side of [-1,1]) for(let i=0;i<10;i++){const y=2.22-i*.15,rad=.58+i*.032;const r=tor("ribs",[side*.025,y,-.02],rad,.032,0xe7dfcf,[Math.PI/2,side>0?-.26:.26,side>0?-.42:.42],Math.PI*.8);r.scale.z=.76}
cap("sternum",[0,1.58,.36],.065,1.35,0xe7dfcf);

// pelvis
const pel=tor("pelvis",[0,-.33,0],.58,.14,0xe7dfcf,[Math.PI/2,0,.48],Math.PI*1.7);

// upper limbs
for(const side of [-1,1]){
 cap("humerus",[side*.94,1.25,0],.088,1.30,0xe7dfcf,[0,0,side*.05]);
 cap("radius",[side*1.00,-.04,.05],.06,1.18,0xe7dfcf,[0,0,-side*.04]);
 cap("ulna",[side*1.13,-.04,-.06],.057,1.17,0xe7dfcf,[0,0,-side*.07]);
}
// lower limbs
for(const side of [-1,1]){
 cap("femur",[side*.42,-1.45,0],.105,1.72,0xe7dfcf,[0,0,-side*.035]);
 sph("patella",[side*.43,-2.37,.20],[.12,.15,.08],0xe7dfcf,.96);
 cap("tibia",[side*.42,-3.03,0],.075,1.50,0xe7dfcf,[0,0,side*.015]);
 cap("fibula",[side*.57,-3.03,-.04],.05,1.46,0xe7dfcf,[0,0,side*.02]);
}

// nervous branches
for(const side of [-1,1]){
 for(let i=0;i<6;i++) tube("cervical-nerves",[[0,2.2-i*.13,-.06],[side*(.25+i*.03),2.15-i*.13,.02],[side*.9,1.45-i*.09,.02]],0xffd86b,.014);
 for(let i=0;i<8;i++) tube("thoracic-nerves",[[0,1.45-i*.18,-.07],[side*.35,1.42-i*.18,.01],[side*.72,1.40-i*.18,.01]],0xffd86b,.012);
 for(let i=0;i<5;i++) tube("lumbar-nerves",[[0,-.15-i*.16,-.04],[side*.22,-.25-i*.17,.01],[side*.42,-1.5-i*.25,.02]],0xffd86b,.014);
}

// lungs and airway
sph("right-lung",[-.39,1.58,.12],[.43,.78,.34],0xf08da0,.77);sph("left-lung",[.39,1.58,.12],[.39,.72,.32],0xf08da0,.77);
cap("trachea",[0,2.43,.23],.09,.76,0x8fd7e8);for(const side of [-1,1])cap("trachea",[side*.18,2.02,.20],.055,.54,0x8fd7e8,[0,0,side*.66]);

// heart chambers
sph("right-atrium",[.12,1.54,.36],[.22,.25,.20],0xc93d53,.95);sph("right-ventricle",[.08,1.28,.39],[.26,.31,.24],0xd54557,.95);
sph("left-atrium",[-.17,1.55,.31],[.19,.22,.18],0xc93d53,.95);sph("left-ventricle",[-.17,1.28,.39],[.27,.34,.25],0xe24958,.95);
const ao=tor("aorta",[-.04,1.76,.35],.20,.05,0xe84a57,[0,0,-.8],Math.PI*1.1);
tube("aorta",[[-.03,1.70,.35],[.12,1.91,.33],[.08,2.30,.24],[.04,2.82,.12]],0xe84a57,.035);
tube("aorta",[[.03,1.64,.31],[.02,.7,.20],[.02,-.4,.10],[.02,-1.1,.04]],0xe84a57,.032);

// digestive / urinary / endocrine
const liver=sph("liver",[.27,.62,.23],[.78,.32,.42],0x93413e,.94);liver.rotation.z=-.08;
sph("gallbladder",[.50,.40,.35],[.09,.18,.09],0x66a267,.95);
const stomach=sph("stomach",[-.32,.46,.23],[.33,.48,.29],0xd77f71,.94);stomach.rotation.z=-.42;
for(let i=0;i<6;i++){const t=tor("intestines",[(i%2?.12:-.12),.05-(i%3)*.16,.20],.28+i*.055,.07,0xe8a58a,[Math.PI/2,0,(i%2?1:-1)*.45],Math.PI*1.65)}
for(const side of [-1,1])sph("kidneys",[side*.42,.33,-.22],[.19,.35,.16],0x914057,.95);
sph("bladder",[0,-.92,.13],[.25,.29,.20],0xd58ca5,.85);
sph("thyroid",[0,2.62,.27],[.25,.15,.11],0xbf84d8,.92);

// system proxy IDs for parent selection
function addProxy(parent,children){(meshById[parent]??=[]).push(...children.flatMap(id=>meshById[id]||[]))}
addProxy("brain",["frontal-lobe","parietal-lobe","temporal-lobe","occipital-lobe","cerebellum","brainstem","pituitary"]);
addProxy("skull",["frontal-bone","parietal-bones","temporal-bones","occipital-bone","sphenoid","mandible"]);
addProxy("spine",["c1-atlas","c2-axis","cervical-spine","thoracic-spine","lumbar-spine","sacrum"]);
addProxy("lungs",["right-lung","left-lung","trachea"]);addProxy("heart",["right-atrium","right-ventricle","left-atrium","left-ventricle","aorta"]);

const particles=[];for(let i=0;i<220;i++)particles.push((Math.random()-.5)*12,Math.random()*9-4,(Math.random()-.5)*8);const pg=new THREE.BufferGeometry();pg.setAttribute("position",new THREE.Float32BufferAttribute(particles,3));scene.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x31516e,size:.018,transparent:true,opacity:.45})));

function ancestry(id){const arr=[];let cur=byId[id];while(cur){arr.unshift(cur);cur=cur.parent?byId[cur.parent]:null}return arr}
function hasVisibleMesh(a){return !!(meshById[a.id]?.length)}
function displaySystem(a){return a.system?systems[a.system].label:"Region"}
function select(id,focus=false){
 const a=byId[id];if(!a)return;selected=a;currentDepth=a.level||0;
 document.getElementById("eyebrow").textContent=(a.system?systems[a.system].label+" system":"Anatomical region")+" • "+a.region;
 document.getElementById("title").textContent=a.name;document.getElementById("latin").textContent=a.latin||"";
 document.getElementById("crumbs").textContent=ancestry(id).map(x=>x.name).join("  ›  ");
 document.getElementById("depthFill").style.width=Math.min(100,20+(currentDepth*18))+"%";
 document.getElementById("depthText").textContent=currentDepth<2?"Choose a region or system to go deeper":currentDepth<4?"You are inside named anatomy":"Deep anatomical structure";
 const kids=childrenOf(id);
 const conn=(a.connections||[]).map(x=>byId[x]).filter(Boolean);
 document.getElementById("detail").innerHTML=
   '<p>'+a.summary+'</p>'+
   '<div class="facts">'+(a.facts||[]).map(f=>'<div class="fact"><strong>'+f[0]+'</strong><span>'+f[1]+'</span></div>').join("")+'</div>'+
   '<h3>What it does</h3><p>'+a.function+'</p>'+
   (kids.length?'<h3>Go deeper</h3><div class="children">'+kids.map(k=>'<div class="child" data-open="'+k.id+'"><span><strong>'+k.name+'</strong><small>'+displaySystem(k)+' • '+k.region+'</small></span><span>›</span></div>').join("")+'</div>':"")+
   (conn.length?'<h3>Connected anatomy</h3><div class="chips">'+conn.map(c=>'<button class="chip" data-open="'+c.id+'">'+c.name+'</button>').join("")+'</div>':"")+
   '<div class="actions"><button id="focusBtn">Focus in 3D</button><button id="isolateBtn">Isolate</button></div>'+
   '<div class="notice">3D geometry is an educational visualization, not a diagnostic or surgical model. The anatomy hierarchy is designed to accept medically reviewed meshes and deeper content as the atlas expands.</div>';
 document.querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>{select(el.dataset.open,true);drill(el.dataset.open)});
 document.getElementById("focusBtn").onclick=()=>focusOn(id);
 document.getElementById("isolateBtn").onclick=()=>isolate(id);
 document.getElementById("right").classList.add("open");
 document.querySelectorAll(".tree-row").forEach(x=>x.classList.toggle("active",x.dataset.id===id));
 if(focus)focusOn(id);
}
function focusOn(id){
 const list=meshById[id]||[];if(!list.length)return;
 const box=new THREE.Box3();list.forEach(m=>box.expandByObject(m));const center=box.getCenter(new THREE.Vector3()),size=Math.max(.4,box.getSize(new THREE.Vector3()).length());
 controls.target.copy(center);const dir=camera.position.clone().sub(center).normalize();camera.position.copy(center.clone().add(dir.multiplyScalar(Math.max(1.7,size*2.05))));
}
function isolate(id){
 isolated=true;const ids=new Set([id,...descendantsOf(id).map(x=>x.id)]);meshes.forEach(m=>m.visible=ids.has(m.userData.id));focusOn(id);document.getElementById("mode").textContent="Isolated: "+byId[id].name;
}
function restore(){isolated=false;exploded=false;systemFilter="all";meshes.forEach(m=>{m.visible=true;m.position.sub(m.userData.explodeOffset||new THREE.Vector3());delete m.userData.explodeOffset});document.querySelectorAll(".sys").forEach((x,i)=>x.classList.toggle("active",i===0));document.getElementById("mode").textContent="Whole-body view";select("body");resetView()}
function drill(id){
 const a=byId[id];if(!a)return;const family=new Set([id,...descendantsOf(id).map(x=>x.id)]);
 if(a.level>=2){meshes.forEach(m=>m.material.opacity=family.has(m.userData.id)?.98:.12);meshes.forEach(m=>m.material.transparent=true);document.getElementById("mode").textContent="Drill-down: "+a.name}
}
function applySystem(filter){
 systemFilter=filter;isolated=false;
 meshes.forEach(m=>{const a=byId[m.userData.id];m.visible=filter==="all"||a?.system===filter;m.material.opacity=.9});
 document.getElementById("mode").textContent=filter==="all"?"Whole-body view":systems[filter].label+" system";
}
function explode(){
 exploded=!exploded;
 const center=new THREE.Vector3(0,1,0);
 meshes.forEach(m=>{
  if(!m.userData.explodeOffset){const d=m.getWorldPosition(new THREE.Vector3()).sub(center).normalize().multiplyScalar(.18+(byId[m.userData.id]?.level||1)*.04);m.userData.explodeOffset=d}
  exploded?m.position.add(m.userData.explodeOffset):m.position.sub(m.userData.explodeOffset);
 });
 document.getElementById("explode").classList.toggle("active",exploded);
}
function resetView(){camera.position.set(5.8,2.7,10);controls.target.set(0,1,0);controls.update()}

const systemsEl=document.getElementById("systems");
const all=document.createElement("button");all.className="sys active";all.innerHTML='<span class="ico">◉</span><span>All systems<small>Everything visible</small></span><span class="count">'+anatomy.filter(x=>x.system).length+'</span>';all.onclick=()=>{document.querySelectorAll(".sys").forEach(x=>x.classList.remove("active"));all.classList.add("active");applySystem("all")};systemsEl.appendChild(all);
Object.entries(systems).forEach(([id,s])=>{const b=document.createElement("button");b.className="sys";const c=anatomy.filter(x=>x.system===id).length;b.innerHTML='<span class="ico">'+s.icon+'</span><span>'+s.label+'<small>Study this system</small></span><span class="count">'+c+'</span>';b.onclick=()=>{document.querySelectorAll(".sys").forEach(x=>x.classList.remove("active"));b.classList.add("active");applySystem(id)};systemsEl.appendChild(b)});

const treeEl=document.getElementById("tree");
function renderTree(parent="body",depth=0){
 const items=childrenOf(parent);for(const a of items){
  const row=document.createElement("div");row.className="tree-row";row.dataset.id=a.id;row.style.paddingLeft=(depth*13+4)+"px";
  const kids=childrenOf(a.id);const dot=a.system?systems[a.system].color:"#61e4ff";
  row.innerHTML='<span class="tree-arrow">'+(kids.length?"›":"·")+'</span><span class="tree-dot" style="background:'+dot+'"></span><span class="tree-name">'+a.name+'</span><span class="tree-level">L'+a.level+'</span>';
  row.onclick=()=>{select(a.id,true);if(a.level>=2)drill(a.id)};treeEl.appendChild(row);renderTree(a.id,depth+1)
 }
}
renderTree();

const search=document.getElementById("search"),results=document.getElementById("results");
function runSearch(){
 const q=search.value.trim().toLowerCase();if(!q){results.style.display="none";return}
 const f=anatomy.filter(a=>(a.name+" "+a.latin+" "+a.region+" "+a.summary+" "+(a.system||"")).toLowerCase().includes(q)).slice(0,12);
 results.innerHTML=f.length?f.map(a=>'<div class="result" data-result="'+a.id+'"><span class="ico">'+(a.system?systems[a.system].icon:"◉")+'</span><span><strong>'+a.name+'</strong><small>'+a.region+' • '+a.latin+'</small></span><span class="tag">L'+a.level+'</span></div>').join(""):'<div class="result"><span></span><span>No match yet<small>The atlas can keep expanding.</small></span></div>';results.style.display="block";
 results.querySelectorAll("[data-result]").forEach(el=>el.onclick=()=>{search.value=byId[el.dataset.result].name;results.style.display="none";select(el.dataset.result,true);drill(el.dataset.result)})
}
search.addEventListener("input",runSearch);search.addEventListener("focus",runSearch);document.addEventListener("click",e=>{if(!e.target.closest(".search"))results.style.display="none"});

const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();let lastClick=0;
renderer.domElement.addEventListener("pointerdown",e=>{
 const r=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);
 const hit=ray.intersectObjects(meshes.filter(m=>m.visible),false)[0];if(!hit)return;
 const id=hit.object.userData.id;const now=Date.now();select(id,false);if(now-lastClick<360)drill(id);lastClick=now;
});
renderer.domElement.addEventListener("pointermove",e=>{const r=renderer.domElement.getBoundingClientRect();mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;ray.setFromCamera(mouse,camera);renderer.domElement.style.cursor=ray.intersectObjects(meshes.filter(m=>m.visible),false)[0]?"pointer":"grab"});

document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{const v=b.dataset.view,pos={front:[0,1.1,10],back:[0,1.1,-10],left:[-10,1.1,0],right:[10,1.1,0]}[v];camera.position.set(...pos);controls.target.set(0,1,0)});
document.getElementById("explode").onclick=explode;document.getElementById("isolate").onclick=()=>isolate(selected.id);document.getElementById("restore").onclick=restore;document.getElementById("reset").onclick=restore;
document.getElementById("quiz").onclick=()=>{
 const pool=anatomy.filter(a=>a.level>=2&&hasVisibleMesh(a));const a=pool[Math.floor(Math.random()*pool.length)];selected=a;document.getElementById("right").classList.add("open");
 document.getElementById("eyebrow").textContent="Quick identification quiz";document.getElementById("title").textContent="Find the structure";document.getElementById("latin").textContent="Use the 3D model, then reveal the answer.";
 document.getElementById("detail").innerHTML='<div class="quiz"><div class="eyebrow">Challenge</div><h2>Find: '+a.name+'</h2><p>Rotate the body and click what you think is correct. You can use the hierarchy if you need a hint.</p><button class="btn primary" id="reveal" style="margin-top:12px">Reveal & isolate</button></div>';document.getElementById("reveal").onclick=()=>{select(a.id,true);isolate(a.id)}
};

document.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();search.focus()}if(e.key==="Escape"){results.style.display="none";document.getElementById("right").classList.remove("open")}});
function resize(){const w=viewport.clientWidth,h=viewport.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}window.addEventListener("resize",resize);resize();
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();(meshById["left-ventricle"]||[]).forEach(m=>{const s=1+Math.sin(t*6)*.014;m.scale.setScalar(s)});controls.update();renderer.render(scene,camera)}animate();
select("body");
</script>
</body>
</html>
